name: Update Finance News

on:
  # GitHub cron is UTC with no daylight saving; ET times shown as EDT / EST.
  schedule:
    - cron: '0 11 * * 1-5'      # pre-market      7:00am / 6:00am ET
    - cron: '45 14 * * 1-5'     # after the open 10:45am / 9:45am ET
    - cron: '0 17 * * 1-5'      # midday          1:00pm / 12:00pm ET
    - cron: '30 21 * * 1-5'     # after the close 5:30pm / 4:30pm ET
    - cron: '30 0 * * 2-6'      # evening         8:30pm / 7:30pm ET (Mon–Fri evenings)
    - cron: '0 13,22 * * 0,6'   # weekends        9:00am & 6:00pm ET (EDT)
  workflow_dispatch:              # Allows manual trigger from GitHub website

permissions:
  contents: write   # needed to commit summaries.json back to repo
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (stops the publish if anything is broken)
        run: python -m unittest discover -s tests -t . -v

      - name: Generate news pages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python finance_news.py

      - name: Commit updated weekly summaries and feed health
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summaries.json data/feed_health.json data/archive data/ai_last.json
          git diff --staged --quiet || git commit -m "chore: update archive, summaries and feed health [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

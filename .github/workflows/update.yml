name: Update Finance News

on:
  # Normal runs are triggered on time by cron-job.org (weekdays 7am, 10am, 1pm, 5pm, 8pm ET;
  # weekends 9am, 6pm ET) because GitHub's own schedule was running 3.5-6 hours late.
  # This is only a daily backup in case that service or its token stops working.
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:              # Allows manual trigger from GitHub website

permissions:
  contents: write   # push data/ to the `data` branch
  issues: write     # open an issue (which emails the owner) when feeds need attention
  pages: write
  id-token: write

# Never run two updates at once (e.g. a manual run during a scheduled one)
concurrency:
  group: update-finance-news
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Archive, recaps, feed health and the AI log live on the `data` branch so the bot's
      # frequent commits don't clutter main (or collide with code pushes).
      - name: Checkout data branch into data/
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (stops the publish if anything is broken)
        run: python -m unittest discover -s tests -t . -v

      - name: Generate news pages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python finance_news.py

      - name: Save data to the data branch
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:data

      - name: Open or update an issue if feeds need attention
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/feed_alerts.md ] || exit 0
          n=$(gh issue list --state open --search 'in:title "Feeds need attention"' --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file data/feed_alerts.md
          else gh issue create --title "Feeds need attention" --body-file data/feed_alerts.md; fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
